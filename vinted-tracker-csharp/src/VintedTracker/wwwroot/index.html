<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vinted Games Tracker</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --border: #e2e5ea;
    --ink: #1a1d23; --ink-2: #4b5563; --ink-3: #8a919c;
    --accent: #2563eb;
    --strong-bg: #dcfce7; --strong-ink: #14532d;
    --deal-bg: #dbeafe; --deal-ink: #1e3a8a;
    --susp-bg: #fef3c7; --susp-ink: #78350f;
    --err: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --surface: #1d2026; --border: #2e323a;
      --ink: #e7e9ec; --ink-2: #aab1bb; --ink-3: #767e89;
      --accent: #60a5fa;
      --strong-bg: #143d24; --strong-ink: #86efac;
      --deal-bg: #1e3356; --deal-ink: #93c5fd;
      --susp-bg: #45350f; --susp-ink: #fcd34d;
      --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 20px 60px; }
  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 16px; margin: 28px 0 10px; }
  .status { color: var(--ink-3); font-size: 13px; }
  button {
    font: inherit; font-size: 13px; padding: 6px 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  table {
    width: 100%; border-collapse: collapse; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
    font-size: 14px;
  }
  th, td { text-align: left; padding: 8px 12px; border-top: 1px solid var(--border); }
  thead th {
    border-top: none; font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--ink-3); font-weight: 600; background: var(--surface);
  }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .muted { color: var(--ink-3); }
  .error { color: var(--err); font-size: 12px; }
  input.price {
    width: 80px; font: inherit; font-size: 13px; text-align: right; padding: 3px 6px;
    border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--ink);
  }
  .table-scroll { overflow-x: auto; }
  .badge {
    display: inline-block; font-size: 11.5px; font-weight: 600; letter-spacing: .02em;
    padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  }
  .badge.strong { background: var(--strong-bg); color: var(--strong-ink); }
  .badge.deal { background: var(--deal-bg); color: var(--deal-ink); }
  .badge.susp { background: var(--susp-bg); color: var(--susp-ink); }
  .deals { display: grid; gap: 10px; }
  .card {
    display: flex; gap: 12px; padding: 12px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px;
  }
  .card img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; background: var(--bg); }
  .card .noimg { width: 64px; height: 64px; border-radius: 8px; background: var(--bg);
    display: flex; align-items: center; justify-content: center; color: var(--ink-3); font-size: 22px; }
  .card .body { min-width: 0; flex: 1; }
  .card .top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .card a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .card a:hover { text-decoration: underline; }
  .card .price { font-weight: 700; font-variant-numeric: tabular-nums; }
  .card .delta {
    font-weight: 700; font-variant-numeric: tabular-nums;
    background: var(--strong-bg); color: var(--strong-ink);
    padding: 1px 8px; border-radius: 999px; font-size: 13px;
  }
  .card .reasons { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
  .card .meta { color: var(--ink-3); font-size: 12px; margin-top: 2px; }
  .addform { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .addform input {
    font: inherit; font-size: 13px; padding: 6px 10px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--surface); color: var(--ink);
  }
  .filters { display: flex; gap: 8px; margin: 0 0 12px; flex-wrap: wrap; }
  .filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .empty { color: var(--ink-3); padding: 20px; text-align: center; background: var(--surface);
    border: 1px dashed var(--border); border-radius: 10px; }
  .card .junk {
    border: none; background: none; color: var(--ink-3); font-size: 15px;
    padding: 2px 6px; align-self: flex-start; cursor: pointer;
  }
  .card .junk:hover { color: var(--err); }
  .blockrow { display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    margin: 0 0 12px; font-size: 12.5px; color: var(--ink-3); }
  .blockrow .chip {
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
    padding: 1px 4px 1px 10px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 2px;
  }
  .blockrow .chip button { border: none; background: none; color: var(--ink-3); padding: 0 4px; font-size: 13px; }
  .blockrow .chip button:hover { color: var(--err); }
  td .del { border: none; background: none; color: var(--ink-3); font-size: 15px; padding: 2px 6px; }
  td .del:hover { color: var(--err); }
  td a { color: var(--accent); text-decoration: none; }
  td a:hover { text-decoration: underline; }
  td a.bargain { color: var(--strong-ink); background: var(--strong-bg);
    padding: 1px 8px; border-radius: 999px; font-weight: 700; }
  .tablebar { display: flex; gap: 12px; align-items: center; margin: 0 0 10px; }
  .tablebar input {
    font: inherit; font-size: 13.5px; padding: 6px 12px; width: 240px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--ink);
  }
  th.sort { cursor: pointer; user-select: none; white-space: nowrap; }
  th.sort:hover { color: var(--accent); }
  th.sort[data-dir]::after { content: ' ▲'; font-size: 9px; }
  th.sort[data-dir="desc"]::after { content: ' ▼'; font-size: 9px; }
  tr.game-row { cursor: pointer; }
  tr.offers-row > td { padding: 0 12px 12px; background: var(--bg); }
  .offers { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 10px; padding-top: 10px; }
  .offer {
    display: flex; gap: 10px; padding: 8px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; text-decoration: none;
    color: var(--ink); align-items: center;
  }
  .offer:hover { border-color: var(--accent); text-decoration: none; }
  .offer img, .offer .noimg { width: 52px; height: 52px; object-fit: cover;
    border-radius: 8px; background: var(--surface-2, var(--bg)); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; color: var(--ink-3); }
  .offer .t { font-size: 12.5px; line-height: 1.35; color: var(--ink-2);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .offer .p { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14px; }
  .offer .p.bargain { color: var(--strong-ink); }
  .offer .when { font-size: 11px; color: var(--ink-3); }
  .offers .empty-offers { grid-column: 1/-1; color: var(--ink-3); font-size: 13px; padding: 8px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎮 Vinted Games Tracker</h1>
    <span class="status" id="status">Łączenie…</span>
    <button class="primary" id="checkNow">Sprawdź teraz</button>
    <button id="cheapestNow" title="Dla każdej śledzonej gry pobiera aktualnie najtańszą sensowną ofertę (ok. minuta)">💰 Najtańsze teraz</button>
    <button id="copyLogs" title="Kopiuje diagnostykę do schowka — wklej ją przy zgłaszaniu problemu">📋 Logi</button>
  </header>

  <h2>Okazje</h2>
  <div class="filters" id="filters" role="group" aria-label="Filtr okazji">
    <button data-f="all" aria-pressed="true">Wszystkie</button>
    <button data-f="Strong" aria-pressed="false">🔥 Mocne</button>
    <button data-f="Deal" aria-pressed="false">Okazje</button>
    <button data-f="Suspicious" aria-pressed="false">⚠️ Podejrzane</button>
  </div>
  <div class="blockrow" id="blockrow" hidden>
    <span>Gruz-lista:</span><span id="blockchips"></span>
  </div>
  <div class="deals" id="deals"><div class="empty">Jeszcze nic — pierwszy przebieg buduje bazę cen.</div></div>

  <h2>Śledzone gry</h2>
  <div class="tablebar">
    <input id="gameFilter" type="search" placeholder="Filtruj gry…" aria-label="Filtruj śledzone gry">
    <span class="muted" id="gameCount"></span>
  </div>
  <div class="table-scroll">
  <table>
    <thead><tr>
      <th class="sort" data-k="title">Gra</th><th>Zapytanie</th>
      <th class="num sort" data-k="median">Mediana rynku</th>
      <th class="num sort" data-k="sampleSize">Próbka</th>
      <th class="num sort" data-k="seenCount">Widziane</th>
      <th class="num sort" data-k="dealCount">Okazje</th>
      <th class="num sort" data-k="cheapest">Najtańsza teraz</th>
      <th class="num">Twój próg</th><th></th>
    </tr></thead>
    <tbody id="games"></tbody>
  </table>
  </div>
  <form class="addform" id="addForm">
    <input name="title" placeholder="Tytuł gry" required>
    <input name="query" placeholder="fraza wyszukiwania" required>
    <input name="maxPrice" type="number" min="0" step="0.01" placeholder="próg zł" style="width:90px">
    <button class="primary">Dodaj grę</button>
  </form>
</div>

<script>
const fmt = new Intl.NumberFormat('pl-PL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const tierBadge = {
  Strong: '<span class="badge strong">🔥 MOCNA OKAZJA</span>',
  Deal: '<span class="badge deal">Okazja</span>',
  Suspicious: '<span class="badge susp">⚠️ Podejrzanie tanio</span>',
};
let filter = 'all';
let lastData = null;

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function ago(iso) {
  if (!iso) return '—';
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 90) return `${Math.round(s)} s temu`;
  if (s < 5400) return `${Math.round(s / 60)} min temu`;
  return `${Math.round(s / 3600)} godz. temu`;
}

function renderDeals(deals) {
  const el = document.getElementById('deals');
  // "Wszystkie" pokazuje prawdziwe okazje; podejrzanie tanie mają własny filtr.
  const rows = deals.filter(d => filter === 'all' ? d.tier !== 'Suspicious' : d.tier === filter);
  if (!rows.length) {
    el.innerHTML = '<div class="empty">Jeszcze nic — pierwszy przebieg buduje bazę cen.</div>';
    return;
  }
  el.innerHTML = rows.map(d => `
    <div class="card">
      ${d.photoUrl ? `<img src="${esc(d.photoUrl)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : '<div class="noimg">🎮</div>'}
      <div class="body">
        <div class="top">
          ${tierBadge[d.tier] ?? ''}
          <a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.title)}</a>
          <span class="price">${fmt.format(d.price)} ${esc(d.currency)}</span>
          ${d.referencePrice != null && d.referencePrice > d.price
            ? `<span class="delta" title="różnica względem odniesienia ${fmt.format(d.referencePrice)} ${esc(d.currency)}">−${fmt.format(d.referencePrice - d.price)} ${esc(d.currency)}</span>`
            : ''}
        </div>
        <div class="reasons">${d.reasons.map(esc).join(' · ')}</div>
        <div class="meta">${esc(d.query)} · score ${d.score} · ${ago(d.firstSeen)}</div>
      </div>
      <button class="junk" data-title="${esc(d.title)}"
        title="Oznacz słowo z tej oferty jako gruz — takie oferty przestaną się liczyć">🚫</button>
    </div>`).join('');
}

let sortKey = null, sortDir = 'asc', gameFilterText = '';
const expanded = new Set();
const offersCache = new Map();

function sortValue(g, key) {
  if (key === 'cheapest') return g.cheapest ? g.cheapest.price : Infinity;
  if (key === 'title') return g.title.toLowerCase();
  return g[key] ?? -1;
}

function offersHtml(q) {
  const data = offersCache.get(q);
  if (!data) return '<div class="empty-offers">Ładowanie ofert…</div>';
  if (!data.offers.length) return '<div class="empty-offers">Brak wiarygodnych ofert z ostatnich 7 dni.</div>';
  return data.offers.map(o => `
    <a class="offer" href="${esc(o.url)}" target="_blank" rel="noopener" title="${esc(o.title)}">
      ${o.photoUrl ? `<img src="${esc(o.photoUrl)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : '<div class="noimg">🎮</div>'}
      <div>
        <div class="p ${o.bargain ? 'bargain' : ''}">${o.bargain ? '🔥 ' : ''}${fmt.format(o.price)} ${esc(o.currency)}</div>
        <div class="t">${esc(o.title)}</div>
        <div class="when">widziane ${ago(o.firstSeen)}</div>
      </div>
    </a>`).join('');
}

async function loadOffers(q) {
  const r = await fetch('/api/games/' + encodeURIComponent(q) + '/offers');
  if (r.ok) {
    offersCache.set(q, await r.json());
    if (lastData) renderGames(lastData.games);
  }
}

function renderGames(games) {
  let rows = games.filter(g =>
    !gameFilterText
    || g.title.toLowerCase().includes(gameFilterText)
    || g.query.toLowerCase().includes(gameFilterText));
  if (sortKey) {
    rows = [...rows].sort((a, b) => {
      const va = sortValue(a, sortKey), vb = sortValue(b, sortKey);
      const c = va < vb ? -1 : va > vb ? 1 : 0;
      return sortDir === 'asc' ? c : -c;
    });
  }
  document.getElementById('gameCount').textContent = `${rows.length}/${games.length}`;
  document.getElementById('games').innerHTML = rows.map(g => `
    <tr class="game-row" data-q="${esc(g.query)}">
      <td>${expanded.has(g.query) ? '▾' : '▸'} ${esc(g.title)}</td>
      <td class="muted">${esc(g.query)}</td>
      <td class="num">${g.median != null ? fmt.format(g.median) : '<span class="muted">za mało danych</span>'}</td>
      <td class="num muted">${g.sampleSize}</td>
      <td class="num muted">${g.seenCount}</td>
      <td class="num muted">${g.dealCount}</td>
      <td class="num">${g.cheapest
        ? `<a class="${g.cheapest.bargain ? 'bargain' : ''}" href="${esc(g.cheapest.url)}" target="_blank" rel="noopener"
             title="${esc(g.cheapest.listingTitle)}${g.cheapest.median != null ? ` · mediana ${fmt.format(g.cheapest.median)}` : ''} · ${g.cheapest.live ? 'sprawdzone' : 'widziane'} ${ago(g.cheapest.checkedAt)}${g.cheapest.live ? '' : ' · z bazy — mogła się już sprzedać'}${g.cheapest.aiNote ? ' · ' + esc(g.cheapest.aiNote) : ''}">${g.cheapest.bargain ? '🔥 ' : ''}${g.cheapest.live ? '' : '~'}${fmt.format(g.cheapest.price)}</a>`
        : '<span class="muted">—</span>'}</td>
      <td class="num"><input class="price" type="number" min="0" step="0.01"
        value="${g.maxPrice ?? ''}" placeholder="—" data-q="${esc(g.query)}"></td>
      <td><button class="del" title="Usuń" data-q="${esc(g.query)}">✕</button></td>
    </tr>
    ${expanded.has(g.query) ? `<tr class="offers-row"><td colspan="9"><div class="offers">${offersHtml(g.query)}</div></td></tr>` : ''}`).join('');
}

document.querySelector('thead').addEventListener('click', e => {
  const th = e.target.closest('th.sort'); if (!th) return;
  const key = th.dataset.k;
  if (sortKey === key) {
    sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    sortKey = key;
    sortDir = key === 'title' ? 'asc' : 'desc';
  }
  for (const x of document.querySelectorAll('th.sort'))
    x.removeAttribute('data-dir');
  th.setAttribute('data-dir', sortDir);
  if (lastData) renderGames(lastData.games);
});

document.getElementById('gameFilter').addEventListener('input', e => {
  gameFilterText = e.target.value.trim().toLowerCase();
  if (lastData) renderGames(lastData.games);
});

function renderBlocklist(list) {
  const row = document.getElementById('blockrow');
  row.hidden = !list.length;
  document.getElementById('blockchips').innerHTML = list.map(k =>
    `<span class="chip">${esc(k)}<button data-k="${esc(k)}" title="Usuń z gruz-listy">✕</button></span>`).join(' ');
}

async function refresh() {
  try {
    const r = await fetch('/api/overview');
    lastData = await r.json();
    renderGames(lastData.games);
    renderDeals(lastData.deals);
    renderBlocklist(lastData.status.blocklist ?? []);
    const st = lastData.status;
    document.getElementById('status').textContent = st.cycleInProgress
      ? 'Sprawdzam oferty…'
      : st.lastError
        ? `⚠ ${st.lastError}`
        : `Ostatni cykl: ${ago(st.lastCycleFinished)} (+${st.lastCycleNewItems} ofert` +
          `${st.watchlistOnly ? '' : ', ' + st.lastCyclePages + ' str.'}) · ` +
          (st.watchlistOnly
            ? `tylko wishlista · kolejka: ${st.queueScanned}/${st.queueTotal} zasianych · `
            : `${st.autoGames} gier auto · `) +
          `w bazie: ${st.itemsTotal} ofert · co ${st.pollIntervalSeconds} s · ` +
          `${st.baseUrl.replace('https://', '')}${st.catalogInfo ? ' · katalog: ' + st.catalogInfo : ''}` +
          ` · AI: ${st.visionEnabled ? '🟢 ' + st.visionModel : '🔴 wyłączona (brak klucza)'}`;
  } catch {
    document.getElementById('status').textContent = 'Brak połączenia z trackerem';
  }
}

document.getElementById('filters').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  filter = b.dataset.f;
  for (const x of e.currentTarget.querySelectorAll('button'))
    x.setAttribute('aria-pressed', String(x === b));
  if (lastData) renderDeals(lastData.deals);
});

document.getElementById('checkNow').addEventListener('click', async e => {
  e.target.disabled = true;
  await fetch('/api/check', { method: 'POST' });
  setTimeout(() => { e.target.disabled = false; refresh(); }, 1500);
});

document.getElementById('cheapestNow').addEventListener('click', async e => {
  e.target.disabled = true;
  e.target.textContent = '💰 Skanuję…';
  await fetch('/api/cheapest', { method: 'POST' });
  // Skan trwa ~1 s na grę; odświeżaj tabelę do jego końca.
  const poll = setInterval(async () => {
    await refresh();
    if (!lastData?.status?.cheapestScanInProgress) {
      clearInterval(poll);
      e.target.disabled = false;
      e.target.textContent = '💰 Najtańsze teraz';
    }
  }, 3000);
});

document.getElementById('copyLogs').addEventListener('click', async e => {
  const r = await fetch('/api/logs');
  const text = await r.text();
  try {
    await navigator.clipboard.writeText(text);
    e.target.textContent = '📋 Skopiowane!';
  } catch {
    window.prompt('Skopiuj ręcznie (Ctrl+C):', text);
  }
  setTimeout(() => { e.target.textContent = '📋 Logi'; }, 2000);
});

document.getElementById('deals').addEventListener('click', async e => {
  const b = e.target.closest('button.junk'); if (!b) return;
  const word = prompt(
    'Jakie słowo z tytułu oznacza gruz? (np. "magnet", "karty", "pluszak")\n\nTytuł oferty:\n' + b.dataset.title);
  if (!word || word.trim().length < 2) return;
  const r = await fetch('/api/blocklist', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ keyword: word.trim() }),
  });
  if (r.ok) {
    const { cleaned } = await r.json();
    alert(`Zapamiętane. Wyczyszczono ${cleaned} ofert z bazy — od teraz "${word.trim()}" = gruz.`);
  }
  refresh();
});

document.getElementById('blockchips').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  await fetch('/api/blocklist/' + encodeURIComponent(b.dataset.k), { method: 'DELETE' });
  refresh();
});

document.getElementById('games').addEventListener('change', async e => {
  const input = e.target.closest('input.price'); if (!input) return;
  const g = lastData.games.find(x => x.query === input.dataset.q); if (!g) return;
  await fetch('/api/games', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title: g.title, query: g.query, aliases: g.aliases ?? null,
      maxPrice: input.value === '' ? null : Number(input.value) }),
  });
  refresh();
});

document.getElementById('games').addEventListener('click', async e => {
  const b = e.target.closest('button.del');
  if (b) {
    if (!confirm(`Przestać śledzić "${b.dataset.q}"?`)) return;
    await fetch('/api/games/' + encodeURIComponent(b.dataset.q), { method: 'DELETE' });
    refresh();
    return;
  }
  // Klik w wiersz (poza linkiem/inputem) rozwija top 5 ofert tej gry.
  if (e.target.closest('a, input, button')) return;
  const row = e.target.closest('tr.game-row'); if (!row) return;
  const q = row.dataset.q;
  if (expanded.has(q)) {
    expanded.delete(q);
  } else {
    expanded.add(q);
    if (!offersCache.has(q)) loadOffers(q);
  }
  if (lastData) renderGames(lastData.games);
});

document.getElementById('addForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = new FormData(e.target);
  await fetch('/api/games', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      title: f.get('title'), query: f.get('query'),
      maxPrice: f.get('maxPrice') ? Number(f.get('maxPrice')) : null,
    }),
  });
  e.target.reset();
  refresh();
});

// Podpisane URL-e zdjęć Vinted wygasają — zepsute zdjęcie zamieniamy na
// placeholder zamiast pustego miejsca (capture, bo error nie bąbelkuje).
document.addEventListener('error', e => {
  const img = e.target;
  if (img.tagName === 'IMG' && img.closest('.offer, .card')) {
    const d = document.createElement('div');
    d.className = 'noimg';
    d.textContent = '🎮';
    img.replaceWith(d);
  }
}, true);

refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
